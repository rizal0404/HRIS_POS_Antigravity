version: "3.8"

services:
  # ---- PostgreSQL Database ----
  postgres:
    image: postgres:16-alpine
    container_name: hris-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hris_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hris_password}
      POSTGRES_DB: ${POSTGRES_DB:-hris_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hris_user} -d ${POSTGRES_DB:-hris_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hris-network

  # ---- HRIS API (Express + Better Auth) ----
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hris-api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-hris_user}:${POSTGRES_PASSWORD:-hris_password}@postgres:5432/${POSTGRES_DB:-hris_db}
      PORT: "3001"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
    networks:
      - hris-network

  # ---- HRIS Web (Vite SPA + Nginx) ----
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    container_name: hris-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - hris-network

volumes:
  postgres_data:

networks:
  hris-network:
    driver: bridge

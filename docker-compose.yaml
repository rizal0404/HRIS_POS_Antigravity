services:
  # ---- PostgreSQL Database ----
  postgres:
    image: postgres:16-alpine
    container_name: hris-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: 
      POSTGRES_PASSWORD: 
      POSTGRES_DB: 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U  -d "]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hris-network

  # ---- HRIS API (Express + Better Auth) ----
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: hris-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://:@postgres:5432/
      - BETTER_AUTH_URL=
      - BETTER_AUTH_SECRET=
      - FRONTEND_URL=
      - TELEGRAM_BOT_TOKEN=
      - GOOGLE_CLIENT_ID=
      - GOOGLE_CLIENT_SECRET=
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
    networks:
      - hris-network

  # ---- HRIS Web (Vite SPA + Nginx) ----
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        VITE_API_URL: 
    container_name: hris-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - hris-network

volumes:
  postgres_data:

networks:
  hris-network:
    driver: bridge
